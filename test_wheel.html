<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wheel Test</title>
<style>body{background:#0a0a0c;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.wrap{width:380px;aspect-ratio:1;position:relative}.wrap canvas{width:100%;height:100%}</style></head>
<body>
<div class="wrap"><canvas id="c"></canvas></div>
<script>
const items=[
  {label:'普通人',weight:4,color:'#1a1a20'},{label:'咒术高层',weight:1,color:'#201830'},
  {label:'咒灵',weight:1,color:'#301020'},{label:'式神',weight:1,color:'#0a2020'},
  {label:'咒骸',weight:1,color:'#1a1a2a'},{label:'咒术师',weight:1,color:'#102040'},
  {label:'诅咒师',weight:1,color:'#300a0a'}
];
const totalW=items.reduce((s,i)=>s+i.weight,0);
const sectors=items.map(i=>({...i,arc:i.weight/totalW*Math.PI*2}));
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let angle=0,spinning=false,target=0,startAngle=0,startTime=0,duration=0;

function resize(){const w=canvas.parentElement.clientWidth,dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=w*dpr;canvas.style.width=w+'px';canvas.style.height=w+'px';draw()}
function _dark(h,amt){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return `rgb(${Math.floor(r*(1-amt))},${Math.floor(g*(1-amt))},${Math.floor(b*(1-amt))})`}

function draw(){
  const w=canvas.parentElement.clientWidth,dpr=Math.min(devicePixelRatio||1,2);
  const cx=w/2*dpr,cy=w/2*dpr,r=(w/2-18)*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w*dpr,w*dpr);
  // outer ring
  ctx.beginPath();ctx.arc(cx,cy,r+10*dpr,0,Math.PI*2);ctx.strokeStyle='rgba(200,30,60,.2)';ctx.lineWidth=3*dpr;ctx.stroke();
  // tick marks
  for(let i=0;i<48;i++){const aa=i/48*Math.PI*2-Math.PI/2;ctx.beginPath();ctx.moveTo(cx+Math.cos(aa)*(r+6*dpr),cy+Math.sin(aa)*(r+6*dpr));ctx.lineTo(cx+Math.cos(aa)*(r+11*dpr),cy+Math.sin(aa)*(r+11*dpr));ctx.strokeStyle=i%3===0?'rgba(200,160,70,.5)':'rgba(200,160,70,.15)';ctx.lineWidth=i%3===0?1.2*dpr:.5*dpr;ctx.stroke()}
  // sectors
  let a=angle-Math.PI/2;
  for(let s of sectors){const sa=a,ea=a+s.arc;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.closePath();ctx.fillStyle=s.color;ctx.fill();
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,sa,ea);ctx.lineTo(cx,cy);ctx.strokeStyle='rgba(200,160,70,.3)';ctx.lineWidth=.6*dpr;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(sa+s.arc/2);const fs=Math.max(10,(w/2-18)*.1)*dpr;ctx.font=`bold ${fs}px sans-serif`;ctx.textAlign='right';ctx.fillStyle='#fff';ctx.fillText(s.label,r-10*dpr,fs*.35);ctx.restore();a=ea}
  // center
  ctx.beginPath();ctx.arc(cx,cy,r*.15,0,Math.PI*2);ctx.fillStyle='#111';ctx.fill();
  // highlight
  if(!spinning){
    let norm=(-angle)%(Math.PI*2);if(norm<0)norm+=Math.PI*2;
    let cum=0,idx=0;for(let i=0;i<sectors.length;i++){cum+=sectors[i].arc;if(norm<cum){idx=i;break}}
    let sa=angle-Math.PI/2;for(let i=0;i<idx;i++)sa+=sectors[i].arc;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r+3*dpr,sa,sa+sectors[idx].arc);ctx.closePath();
    ctx.strokeStyle='rgba(255,48,80,.5)';ctx.lineWidth=3*dpr;ctx.stroke();
  }
}

canvas.addEventListener('click',()=>{
  if(spinning)return;
  spinning=true;
  const ii=Math.floor(Math.random()*sectors.length);
  let ca=0;for(let i=0;i<ii;i++)ca+=sectors[i].arc;
  const j=(Math.random()-.5)*sectors[ii].arc*.6;
  target=angle+(6+Math.floor(Math.random()*4))*Math.PI*2-ca-sectors[ii].arc/2+j;
  startAngle=angle;startTime=performance.now();duration=3000+Math.random()*2000;
});

resize();
window.addEventListener('resize',resize);

function loop(t){
  if(spinning){
    const p=Math.min((t-startTime)/duration,1),e=1-Math.pow(1-p,3);
    angle=startAngle+(target-startAngle)*e;
    if(p>=1){angle=target;spinning=false}
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
console.log('Wheel test ready. Click to spin.');
</script></body></html>
